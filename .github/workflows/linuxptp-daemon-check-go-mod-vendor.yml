# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: "linuxptp-daemon: Go mod tidy and vendor"

on:
  push:
    branches:
      - "monorepo"
  pull_request:
    branches:
      - "monorepo"

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/linuxptp-daemon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy
        run: GOWORK=off go mod tidy

      - name: Vendor
        run: GOWORK=off go mod vendor

      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::go mod tidy/vendor produced changes. Run 'go mod tidy && go mod vendor' locally and commit the results."
            exit 1
          fi
