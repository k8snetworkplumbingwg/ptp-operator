# Test stability CI for ptp-operator.
# Runs each selected mode N times and produces a stability report
# identifying stable, flaky, intermittent, and broken tests.
#
# Image build / DKMS / Kind setup steps live in .github/actions/ and are
# shared with netdevsim-ci.yml so dependency changes land in one place.
#
# ## What a green check means
# The stability-test matrix jobs stay green as long as the harness produces
# results (so all N runs are collected even when suites fail). The
# stability-report job is the gate: it fails if any requested mode is
# missing, any mode completed fewer than the requested N runs, any mode
# has 0 suite passes, or any test is classified Broken. Flaky/Intermittent
# appear in the report but do not fail the check.
#
# ## Triggers / selection
#   - Every PR (opened/synchronize/reopened): default **oc × 3**
#   - Override with labels (replace the default for that run):
#       run-stability              → oc × 3
#       run-stability/<mode>       → mode × 3
#       run-stability/<mode>/<N>   → mode × N
#       run-stability/all[/N]      → full matrix
#       (comma modes OK: run-stability/oc,bc/5)
#   - skip-stability              → disable automated stability on the PR
#   - workflow_dispatch           → choose mode + runs in the UI
#
# Fork PRs: remove override labels manually when done (GITHUB_TOKEN cannot
# reliably edit labels on fork PRs).

name: Test Stability

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      stability_mode:
        description: "Test mode"
        required: true
        type: choice
        options:
          - oc
          - bc
          - dualnicbc
          - dualnicbcha
          - dualfollower
          - tgm
          - tgmoc
          - tgmbc
          - all
        default: all
      stability_runs:
        description: "Number of runs per mode (default: 5)"
        required: false
        type: number

permissions:
  contents: read
  actions: write

concurrency:
  group: stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DKMS_PKG: netdevsim
  DKMS_VER: "6.9.5"
  DKMS_REPO: https://github.com/redhat-cne/netdevsim-dkms.git
  DKMS_BRANCH: main

jobs:
  # ------------------------------------------------------------------
  # Gate + resolve mode/runs (default oc×3, labels override, skip-stability)
  # ------------------------------------------------------------------
  gate:
    runs-on: ubuntu-24.04
    # Skip when skip-stability is on the PR, or when an unrelated label was
    # added (labeled events only proceed for run-stability*).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-stability') &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'run-stability' ||
        startsWith(github.event.label.name, 'run-stability/')))
    outputs:
      modes: ${{ steps.set.outputs.modes }}
      runs: ${{ steps.set.outputs.runs }}
    steps:
      - name: Resolve mode list and run count
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          DISPATCH_MODE: ${{ github.event.inputs.stability_mode || '' }}
          DISPATCH_RUNS: ${{ github.event.inputs.stability_runs || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        run: |
          set -euo pipefail

          parse_label() {
            local label="$1"
            local raw runs rest
            if [[ "$label" == "run-stability" ]]; then
              echo "oc|3"
              return
            fi
            rest="${label#run-stability/}"
            if [[ "$rest" =~ ^(.+)/([0-9]+)$ ]]; then
              raw="${BASH_REMATCH[1]}"
              runs="${BASH_REMATCH[2]}"
            else
              raw="$rest"
              runs="3"
            fi
            echo "${raw}|${runs}"
          }

          RAW=""
          RUNS=""
          LABEL=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW="$DISPATCH_MODE"
            RUNS="${DISPATCH_RUNS:-5}"
          elif [[ "$EVENT_ACTION" == "labeled" && ( "$EVENT_LABEL" == "run-stability" || "$EVENT_LABEL" == run-stability/* ) ]]; then
            LABEL="$EVENT_LABEL"
            IFS='|' read -r RAW RUNS < <(parse_label "$LABEL")
          else
            # opened / synchronize / reopened: labels override default oc×3
            mapfile -t STAB_LABELS < <(printf '%s\n' "$PR_LABELS" | grep -E '^run-stability(/|$)' || true)
            if [[ ${#STAB_LABELS[@]} -eq 0 ]]; then
              RAW="oc"
              RUNS="3"
            else
              MODES_ACC=()
              RUNS_ACC=3
              for lab in "${STAB_LABELS[@]}"; do
                IFS='|' read -r raw runs < <(parse_label "$lab")
                if [[ "$raw" == "all" ]]; then
                  MODES_ACC=(all)
                  RUNS_ACC="$runs"
                  break
                fi
                IFS=',' read -r -a parts <<< "$raw"
                for m in "${parts[@]}"; do
                  m="${m#"${m%%[![:space:]]*}"}"
                  m="${m%"${m##*[![:space:]]}"}"
                  [[ -n "$m" ]] && MODES_ACC+=("$m")
                done
                if [[ "$runs" -gt "$RUNS_ACC" ]]; then
                  RUNS_ACC="$runs"
                fi
              done
              if [[ ${#MODES_ACC[@]} -eq 1 && "${MODES_ACC[0]}" == "all" ]]; then
                RAW="all"
              else
                # dedupe modes
                RAW=$(printf '%s\n' "${MODES_ACC[@]}" | awk 'NF && !seen[$0]++' | paste -sd ',')
              fi
              RUNS="$RUNS_ACC"
            fi
          fi

          if [[ ! "$RUNS" =~ ^[0-9]+$ ]] || [[ "$RUNS" -lt 1 ]]; then
            echo "::error::stability runs must be an integer >= 1 (got: ${RUNS:-empty})"
            exit 1
          fi

          if [[ -z "$RAW" ]]; then
            echo "::error::stability mode must not be empty (label: ${LABEL:-n/a})"
            exit 1
          fi

          ALLOWED=' oc bc dualnicbc dualnicbcha dualfollower tgm tgmoc tgmbc '
          if [[ "$RAW" == "all" ]]; then
            MODES_JSON='["oc","bc","dualnicbc","dualnicbcha","dualfollower","tgm","tgmoc","tgmbc"]'
          else
            MODES_JSON='['
            first=1
            IFS=',' read -r -a parts <<< "$RAW"
            for m in "${parts[@]}"; do
              m="${m#"${m%%[![:space:]]*}"}"
              m="${m%"${m##*[![:space:]]}"}"
              [[ -z "$m" ]] && continue
              if [[ "$ALLOWED" != *" $m "* ]]; then
                echo "::error::unsupported stability mode '$m' (label: ${LABEL:-n/a})"
                exit 1
              fi
              if [[ $first -eq 1 ]]; then
                MODES_JSON+="\"$m\""
                first=0
              else
                MODES_JSON+=",\"$m\""
              fi
            done
            MODES_JSON+=']'
          fi

          if [[ -z "$MODES_JSON" || "$MODES_JSON" == "[]" ]]; then
            echo "::error::no modes resolved from '${RAW}' (label: ${LABEL:-n/a})"
            exit 1
          fi

          echo "modes=${MODES_JSON}" >> "$GITHUB_OUTPUT"
          echo "runs=${RUNS}" >> "$GITHUB_OUTPUT"
          echo "Resolved modes=${MODES_JSON} runs=${RUNS}"

  # ------------------------------------------------------------------
  # Build images (mirrors netdevsim-ci ptp-images job)
  # ------------------------------------------------------------------
  ptp-images:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v5

      - name: Setup podman
        uses: ./.github/actions/setup-podman

      - name: Copy checkout to /root/ptp-operator
        uses: ./.github/actions/copy-checkout

      - name: Build images and export tarball
        run: |
          sudo bash -l <<'BUILD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --images "${VM_IP}"

          rm -rf /tmp/go-build* /root/.cache/go-build
          BUILD

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: ptp-images-stability
          path: /tmp/ptp-images.tar
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # One parallel runner per mode — deploy cluster, run N times
  # ------------------------------------------------------------------
  stability-test:
    needs: [ptp-images, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    name: "stability (${{ matrix.mode }})"
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(needs.gate.outputs.modes) }}
    steps:
      - name: "Runner info (${{ matrix.mode }})"
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"
          echo "Mode: ${{ matrix.mode }}"
          echo "Runs: ${{ needs.gate.outputs.runs }}"

      - uses: actions/checkout@v5

      - name: Setup podman
        uses: ./.github/actions/setup-podman

      - name: Install OpenShift CLI
        uses: ./.github/actions/install-oc

      - name: Install netdevsim DKMS
        uses: ./.github/actions/install-dkms

      - name: Copy checkout to /root/ptp-operator
        uses: ./.github/actions/copy-checkout

      - name: Download image tarball
        uses: actions/download-artifact@v7
        with:
          name: ptp-images-stability
          path: /tmp

      - name: Load images into local registry
        run: |
          sudo bash -l <<'LOAD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --load /tmp/ptp-images.tar "${VM_IP}"
          LOAD

      - name: Free disk space before tests
        run: |
          sudo bash -l <<'CLEANUP'
          set -euo pipefail
          rm -rf /tmp/ptp-images.tar /tmp/ptp-images-load
          rm -rf /tmp/go-build* /var/cache/apt /root/.cache
          df -h
          CLEANUP

      - name: Deploy Kind cluster
        run: |
          sudo bash -l <<'SETUP'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --cluster "${VM_IP}" "${VM_IP}"
          SETUP

      - name: "Run stability tests: ${{ matrix.mode }} x${{ needs.gate.outputs.runs }}"
        run: |
          sudo bash -l <<'TEST'
          set -uo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman
          export DKMS_MODE=true
          export ENABLE_CEPV2=true

          VM_IP=$(hostname -I | awk '{print $1}')
          export IMG_PREFIX="${VM_IP}/test"

          cd /root/ptp-operator/scripts

          # Collect all N runs even when suites fail; stability-report gates.
          ./stability-test.sh \
            --mode "${{ matrix.mode }}" \
            --runs "${{ needs.gate.outputs.runs }}" \
            --output-dir /tmp/stability-results \
            --linuxptp-daemon-image "$IMG_PREFIX:lptpd" \
            --must-gather-image "$IMG_PREFIX:ptpmg" \
            --debug-image "$IMG_PREFIX:debug" \
            || true

          if [[ ! -d /tmp/stability-results/${{ matrix.mode }} ]]; then
            echo "::error::stability-test.sh produced no results for ${{ matrix.mode }} (infrastructure failure)"
            exit 1
          fi
          TEST

      - name: Collect Kubernetes debug info
        if: always()
        run: |
          sudo bash -l <<'DEBUGINFO'
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          mkdir -p /tmp/stability-results/${{ matrix.mode }}/k8s-debug
          kubectl get pods -n openshift-ptp -o wide \
            > /tmp/stability-results/${{ matrix.mode }}/k8s-debug/pods.txt 2>&1 || true
          kubectl get events -n openshift-ptp \
            --sort-by=.metadata.creationTimestamp \
            > /tmp/stability-results/${{ matrix.mode }}/k8s-debug/events.txt 2>&1 || true
          kubectl describe pods -n openshift-ptp -l app=linuxptp-daemon \
            > /tmp/stability-results/${{ matrix.mode }}/k8s-debug/linuxptp-daemon-describe.txt 2>&1 || true
          for pod in $(kubectl get pods -n openshift-ptp -l app=linuxptp-daemon \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl logs -n openshift-ptp "$pod" -c cloud-event-proxy --previous \
              > "/tmp/stability-results/${{ matrix.mode }}/k8s-debug/${pod}-cep-previous.txt" 2>&1 || true
          done
          DEBUGINFO

      # Upload the parent dir so the artifact root keeps <mode>/... .
      # Uploading ${{ matrix.mode }}/ alone strips that directory name, which
      # then breaks single-artifact downloads (download-artifact flattens when
      # only one artifact matches the pattern).
      - name: Upload stability results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-results-${{ matrix.mode }}
          path: /tmp/stability-results/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          for id in $(ls /sys/bus/netdevsim/devices/ 2>/dev/null | sed 's/netdevsim//'); do
            echo "$id" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          done
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

  # ------------------------------------------------------------------
  # Aggregate per-mode results into a single stability report (the gate)
  # ------------------------------------------------------------------
  stability-report:
    needs: [gate, stability-test]
    if: >-
      always() &&
      needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # merge-multiple: true drops each artifact's <mode>/ tree into the same
      # destination. Combined with uploading /tmp/stability-results/ (which
      # contains <mode>/), this yields /tmp/stability-merged/<mode>/ for both
      # single- and multi-artifact runs without a rearrange step.
      - name: Download all stability results
        uses: actions/download-artifact@v7
        with:
          pattern: stability-results-*
          path: /tmp/stability-merged
          merge-multiple: true

      - name: Verify downloaded stability layout
        env:
          REQUESTED_MODES: ${{ join(fromJson(needs.gate.outputs.modes), ' ') }}
        run: |
          set -euo pipefail
          FOUND=0
          for mode in ${REQUESTED_MODES}; do
            if [[ -d "/tmp/stability-merged/${mode}" ]]; then
              FOUND=$((FOUND + 1))
            else
              echo "::warning::Missing results for mode '${mode}'"
            fi
          done
          if [[ $FOUND -eq 0 ]]; then
            echo "::error::No stability results found to merge"
            echo "Download tree:"
            find /tmp/stability-merged -maxdepth 3 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "Merged layout:"
          find /tmp/stability-merged -maxdepth 2 -type d | head -30

      - name: Generate stability report
        run: |
          MODES='${{ join(fromJson(needs.gate.outputs.modes), ' ') }}'
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          REPORT="/tmp/stability-merged/stability-report-${TIMESTAMP}.md"
          # Export before --gate so if: always() summary can still cat the
          # report when the gate fails (bash -e stops the step otherwise).
          echo "REPORT_FILE=${REPORT}" >> "$GITHUB_ENV"

          # --gate: fail if missing modes, incomplete runs, 0 suite passes,
          # or Broken tests.
          python3 scripts/aggregate-stability.py \
            --results-dir /tmp/stability-merged \
            --output "$REPORT" \
            --modes "$MODES" \
            --expected-runs "${{ needs.gate.outputs.runs }}" \
            --gate

      - name: Post summary
        if: always()
        run: |
          if [[ -n "${REPORT_FILE:-}" && -f "${REPORT_FILE}" ]]; then
            echo "## Test Stability Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Green on this job means: every requested mode produced results," >> "$GITHUB_STEP_SUMMARY"
            echo "every mode completed the requested run count, every mode had" >> "$GITHUB_STEP_SUMMARY"
            echo "≥1 suite pass, and no test is Broken." >> "$GITHUB_STEP_SUMMARY"
            echo "Flaky/Intermittent are reported below but do not fail the check." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Test Stability Report" >> "$GITHUB_STEP_SUMMARY"
            echo "No report generated. Check the stability-results artifacts for raw data." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-report-combined
          path: /tmp/stability-merged/stability-report-*.md
          if-no-files-found: ignore

      - name: Reminder — remove override labels on fork PRs
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled'
        run: |
          echo "::notice::Maintainers: remove override label '${{ github.event.label.name }}' manually when done."
          echo "Fork PRs cannot reliably clear labels with GITHUB_TOKEN; do not rely on automation here."
