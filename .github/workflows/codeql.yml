name: CodeQL

on:
  push:
    branches:
      - monorepo
  pull_request:
    branches:
      - monorepo
  schedule:
    - cron: "20 21 * * 4"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  setup:
    name: Discover Go modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: modules
        shell: bash
        run: |
          set -euo pipefail
          entries='{"module":"root","path":"."}'
          if [ -f pkg/linuxptp-daemon/go.mod ]; then
            entries="${entries},{\"module\":\"lptpd\",\"path\":\"pkg/linuxptp-daemon\"}"
          fi
          if [ -f pkg/cloud-event-proxy/go.mod ]; then
            entries="${entries},{\"module\":\"cep\",\"path\":\"pkg/cloud-event-proxy\"}"
          fi
          echo "matrix={\"include\":[${entries}]}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (go, ${{ matrix.module }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual

      - name: Build ${{ matrix.module }}
        working-directory: ${{ matrix.path }}
        env:
          GOWORK: "off"
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go-${{ matrix.module }}"
