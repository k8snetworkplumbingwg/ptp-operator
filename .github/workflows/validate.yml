name: Validate

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: |
          # proxy.golang.org occasionally returns INTERNAL_ERROR mid-download;
          # retry tidy+download a few times before failing the job.
          for attempt in 1 2 3 4 5; do
            if go mod tidy && go mod download; then
              exit 0
            fi
            echo "go mod attempt ${attempt} failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "go mod tidy/download failed after retries"
          exit 1

      - name: Run vet
        run: make vet
        
      - name: Run fmt
        run: make fmt 

      - name: Bundle check
        run: make bundle-check
