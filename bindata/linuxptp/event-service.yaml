---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "false"
    {{- if .EnableEventAuth }}
    service.beta.openshift.io/serving-cert-secret-name: ptp-event-publisher-server-tls-{{.NodeName}}
    {{- else }}
    service.beta.openshift.io/serving-cert-secret-name: ""
    {{- end }}
  labels:
    app: linuxptp-daemon
  name:  ptp-event-publisher-service-{{.NodeName}}
  namespace: {{.Namespace}}
spec:
  clusterIP: None
  selector:
    app: linuxptp-daemon
    nodeName: {{.NodeName}}
  ports:
    - name: publisher-port
      port: 9043
  sessionAffinity: None
  type: ClusterIP
